name: Build TizenTube Standalone and Release

on:
  workflow_dispatch:
  push:
    branches: 
      - main

env:
  TIZEN_STUDIO_VER: 5.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy local userScript into standalone service
        run: |
          mkdir -p standalone/service/scripts
          if [ -f service/scripts/userScript.js ]; then
            cp service/scripts/userScript.js standalone/service/scripts/userScript.js
            echo "✅ Đã copy thành công userScript.js vào thư mục standalone/service/scripts/"
          else
            echo "⚠️ Cảnh báo: Không tìm thấy file service/scripts/userScript.js trong repo!"
            exit 1
          fi

      # ---------------------------------------------------------------
      # [Từ bản FORK] Tải và cài Tizen Studio CLI
      # ---------------------------------------------------------------
      - name: Download and Install Tizen Studio CLI
        run: |
          set -euo pipefail
          curl -fL -o tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "${GITHUB_WORKSPACE}/tizen-studio"
          rm ./tizen-installer
          echo "${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin" >> $GITHUB_PATH
          export PATH="${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin:$PATH"

      # ---------------------------------------------------------------
      # [Từ bản FORK] Chuẩn bị chứng chỉ + profile ký của Tizen Studio.
      # Thêm cuối bước: xuất mật khẩu chứng chỉ ra TIZEN_AUTHOR_PW để các bước sau
      # (tizenjs) dùng chung đúng 1 chứng chỉ, kể cả khi phải dùng chứng chỉ tự sinh.
      # ---------------------------------------------------------------
      - name: Configure Certificate and Profile
        env:
          AUTHOR_P12_B64: ${{ secrets.TIZEN_AUTHOR_KEY }}
          AUTHOR_P12_PASSWORD: ${{ secrets.TIZEN_AUTHOR_KEY_PW }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/tizen-data/keystore/author"
          mkdir -p "${GITHUB_WORKSPACE}/tizen-data/profile"

          # 1. Tự sinh chứng chỉ tạm thời nếu thiếu Secret hoặc giải mã chứng chỉ thật từ Secret
          if [ -z "${AUTHOR_P12_B64:-}" ]; then
            echo "⚠️ Không tìm thấy TIZEN_AUTHOR_KEY secret. Khởi tạo chứng chỉ self-signed tạm thời..."
            FINAL_PW="password123"
            openssl req -x509 -newkey rsa:2048 -keyout /tmp/author.key -out /tmp/author.crt -days 3650 -nodes -subj "/CN=TizenTubeDev/O=TizenTube/C=US"
            openssl pkcs12 -export -out "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -inkey /tmp/author.key -in /tmp/author.crt -passout pass:"$FINAL_PW" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f /tmp/author.key /tmp/author.crt
          else
            echo "✅ Đã tìm thấy TIZEN_AUTHOR_KEY secret. Đang giải mã..."
            FINAL_PW="${AUTHOR_P12_PASSWORD}"
            echo "$AUTHOR_P12_B64" | base64 -d > "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12"

            # Convert chuẩn mã hóa tương thích tuyệt đối với Tizen CLI
            openssl pkcs12 -legacy -in "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -out /tmp/author-intermediate.pem -nodes -passin pass:"$FINAL_PW" || \
            openssl pkcs12 -in "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -out /tmp/author-intermediate.pem -nodes -passin pass:"$FINAL_PW"
            
            openssl pkcs12 -export -legacy -in /tmp/author-intermediate.pem -passout pass:"$FINAL_PW" -out "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            rm -f /tmp/author-intermediate.pem
          fi

          # Chia sẻ mật khẩu cho các bước sau (được che trong log)
          echo "::add-mask::${FINAL_PW}"
          echo "TIZEN_AUTHOR_PW=${FINAL_PW}" >> "$GITHUB_ENV"

          # 2. Tạo trực tiếp file profiles.xml chuẩn để cấu hình ký chứng chỉ
          cat << EOF > "${GITHUB_WORKSPACE}/tizen-data/profile/profiles.xml"
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="TizenTubeStandalone" version="3.1">
            <profile name="TizenTubeStandalone">
              <profileitem
                ca="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/developer/tizen-developer-ca.cer"
                distributor="0"
                key="${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12"
                password="${FINAL_PW}"
                rootca=""/>
              <profileitem
                ca="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/distributor/sdk-public/tizen-distributor-ca.cer"
                distributor="1"
                key="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates/distributor/sdk-public/tizen-distributor-signer.p12"
                password="tizenpkcs12passfordsigner"
                rootca=""/>
              <profileitem ca="" distributor="2" key="" password="" rootca=""/>
            </profile>
          </profiles>
          EOF

          tizen cli-config "profiles.path=${GITHUB_WORKSPACE}/tizen-data/profile/profiles.xml"

      - name: Install modules, transpile service and build service for DIAL
        working-directory: service
        run: |
          npm install
          npx rollup -c rollup.config.js

      - name: Install modules, transpile service and build service
        working-directory: standalone/service
        run: |
          npm install
          npm install -g @vercel/ncc https://github.com/reisxd/tizen.js/tarball/main
          npm run build
          rm -rf node_modules

      # tizenjs vẫn cần file p12 ở gốc workspace: lấy đúng chứng chỉ vừa cấu hình ở trên
      - name: Prepare Tizen Certificate
        run: |
          cp "${GITHUB_WORKSPACE}/tizen-data/keystore/author/author.p12" "${GITHUB_WORKSPACE}/TizenTube-author.p12"

      # Build gói wgt bằng tizenjs như bản ORIGINAL (mật khẩu lấy từ TIZEN_AUTHOR_PW)
      - name: Build TizenTube
        working-directory: standalone
        run: |
          mkdir -p release
          tizenjs build . -t wgt -o release/TizenTube.wgt --author "${GITHUB_WORKSPACE}/TizenTube-author.p12" --authorPwd "${TIZEN_AUTHOR_PW}" -p public --ignore node_modules,/.*\.wgt$/,/userwidget/,/release/

      # Từ gói tizenjs vừa build, tạo ra 2 file xuất:
      #   - TizenTube-unsigned.wgt : cùng nội dung, đã bỏ các file chữ ký
      #   - TizenTube-signed.wgt   : ký lại bằng profile Tizen Studio (TizenTubeStandalone)
      - name: Create unsigned and signed packages
        working-directory: standalone/release
        run: |
          set -euo pipefail
          BASE_WGT="TizenTube.wgt"
          UNSIGNED_WGT="TizenTube-unsigned.wgt"
          SIGNED_WGT="TizenTube-signed.wgt"

          # 1) Bản KHÔNG chữ ký: sao chép gói và loại bỏ file chữ ký ở thư mục gốc của wgt
          python3 - "$BASE_WGT" "$UNSIGNED_WGT" <<'PY'
          import re, sys, zipfile
          src, dst = sys.argv[1], sys.argv[2]
          sig = re.compile(r'^(author-)?signature\d*\.xml$')
          removed = []
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if sig.match(item.filename):
                      removed.append(item.filename)
                      continue
                  zout.writestr(item, zin.read(item.filename))
          print('Removed signature files:', removed if removed else 'none')
          PY

          if unzip -Z1 "$UNSIGNED_WGT" | grep -Eq '^(author-)?signature[0-9]*\.xml$'; then
            echo "::error::Bản unsigned vẫn còn file chữ ký!"
            exit 1
          fi

          # 2) Bản CÓ chữ ký: giải nén bản unsigned rồi đóng gói + ký bằng Tizen Studio
          rm -rf /tmp/wgt-build && mkdir -p /tmp/wgt-build
          unzip -q "$UNSIGNED_WGT" -d /tmp/wgt-build
          (cd /tmp/wgt-build && tizen package -t wgt -s TizenTubeStandalone -- ./)
          SIGNED_SRC="$(ls /tmp/wgt-build/*.wgt | head -n 1)"
          cp "$SIGNED_SRC" "$SIGNED_WGT"
          rm -rf /tmp/wgt-build

          if ! unzip -Z1 "$SIGNED_WGT" | grep -Eq '^author-signature\.xml$'; then
            echo "::error::Bản signed không có author-signature.xml!"
            exit 1
          fi

          # Bỏ gói trung gian của tizenjs để release chỉ còn đúng 2 file
          rm -f "$BASE_WGT"
          ls -la

      - name: Upload TizenTube package artifacts (signed + unsigned)
        uses: actions/upload-artifact@v4
        with:
            name: TizenTubeSamsung-Built
            path: |
              standalone/release/TizenTube-signed.wgt
              standalone/release/TizenTube-unsigned.wgt
            if-no-files-found: error